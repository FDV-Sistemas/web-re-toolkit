name: build-wre-cli

# Compila o CLI `wre` para o Mac do time (Apple Silicon), so para CAPTURAR PERFIS:
#   ./wre sandbox capture --open --label <id> --root .
# Existe para ninguem precisar montar Rust nem esperar o build que linka o V8.
# O `wred` (sidecar de producao) e outro alvo, em build-wred.yml, e e linux/x86_64.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-wre-cli.yml']
    branches: [fix/trust-anchors]

jobs:
  build:
    runs-on: macos-14          # Apple Silicon (arm64), igual ao Mac do time
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc -vV

      - uses: Swatinem/rust-cache@v2
        with:
          key: wre-cli-macos-arm64

      - name: Dependencias de build
        run: brew install cmake ninja || true

      - name: cargo build --release (cli + wred)
        # o wred macOS serve para medir a Azul a partir de uma conexao RESIDENCIAL,
        # que e o unico IP que recebe bm_sc 4~1; o da VPS e linux/x86_64
        run: cargo build --release -p wre-cli -p wre-clientd

      - name: Conferir os binarios
        run: |
          file target/release/wre target/release/wred
          file target/release/wred | grep -q "arm64"
          ./target/release/wred --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: wre-macos-arm64
          path: |
            target/release/wre
            target/release/wred
          retention-days: 14
